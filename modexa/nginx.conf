# Nginx location snippet for the server block serving this static site.
# Add these locations to the active aaPanel virtual-host configuration.
# Do not paste this snippet inside another location block.

location = /index.html {
    return 301 /;
}

location ~ ^/(.+)\.html$ {
    return 301 /$1;
}

location / {
    try_files $uri $uri/ $uri.html =404;
}
