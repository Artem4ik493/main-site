# Nginx snippet for the static Modexa site (aaPanel virtual host).
# /privacy -> /privacy.html and /terms -> /terms.html, while clean URLs remain canonical.

location = /index.html {
    return 301 /;
}

location ~ ^/(.+)\.html$ {
    return 301 /$1;
}

location = /privacy {
    try_files /privacy.html =404;
}

location = /terms {
    try_files /terms.html =404;
}

location / {
    try_files $uri $uri/ $uri.html =404;
}
